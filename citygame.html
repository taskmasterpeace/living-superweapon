<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- ⚠ `viewport-fit=cover` IS LOAD-BEARING, NOT DECORATION. Without it iOS/iPadOS never reports a
     safe area, so every `env(safe-area-inset-*)` in the project resolves to 0px — twelve call sites
     across the HUD and the touch layer, all written specifically to keep controls clear of the
     notch, the home indicator and the rounded corners. They were all silently no-ops on the exact
     devices they exist for. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>WAR WORLD: ASCENDANTS</title>
