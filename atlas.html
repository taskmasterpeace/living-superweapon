<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ATLAS — city generator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230a0c12'/%3E%3Cpath d='M20 30l20-10 20 10 20-10v50l-20 10-20-10-20 10z' fill='none' stroke='%23f5b21a' stroke-width='7'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/src/styles/tokens.css" />
<link rel="stylesheet" href="/src/styles/overlays.css" />
<style>
  /* ATLAS standalone shell — the world fills the window, the panel rides on top.
     Everything visual comes from the shared tokens/overlays sheets. NO PURPLE. */
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:100%; height:100%; background:#05060a; overflow:hidden; }
  body{ font-family:var(--f-display); color:var(--text); }
  #game{ position:fixed; inset:0; width:100%; height:100%; display:block; }
  /* the panel is a left rail over the live world, list visible (solo keeps browsing while live) */
  #hAtlas.solo{ display:flex; justify-content:flex-start; align-items:flex-start; background:none; pointer-events:none; }
  #hAtlas.solo .obox{ margin:10px 0 0 10px; max-height:calc(100vh - 20px); overflow-y:auto;
    pointer-events:auto; background:var(--surface-solid); box-shadow:0 18px 60px rgba(0,0,0,.7); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script type="module" src="/src/tool/atlas-main.js"></script>
</body>
</html>
