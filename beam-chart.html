<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE BEAM CHART</title>
<style>
  :root{--ink:#14100c;--card:#1d1712;--line:#3a2f1e;--gold:#f5b21a;--gold-pale:#ffe08a;--text:#f0e6d4;--dim:#a89778;--blue:#9fd4ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif;padding:28px 4vw 80px}
  h1{font-size:26px;letter-spacing:.14em;color:var(--gold);margin:0 0 2px}
  h1 small{color:var(--dim);font-size:12px;letter-spacing:.04em;display:block;margin-top:4px;font-weight:400}
  h2{font-size:13px;letter-spacing:.22em;color:var(--gold-pale);border-bottom:1px solid var(--line);padding-bottom:6px;margin:34px 0 12px}
  .bar{display:flex;gap:14px;margin:14px 0 6px;font:12px Cascadia Code,Consolas,monospace}
  .bar a{color:var(--blue);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px}
  .bar a:hover{border-color:var(--gold)}
  .vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
  .v{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px}
  .v b{color:var(--gold);font:600 12px Cascadia Code,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase}
  .v span{display:block;color:var(--dim);font-size:12px;margin-top:2px}
  .axis{color:var(--blue);font:11px Cascadia Code,monospace;letter-spacing:.1em;margin:16px 0 6px;text-transform:uppercase}
  table{border-collapse:collapse;width:100%;font:12px Cascadia Code,Consolas,monospace}
  th{color:var(--dim);text-align:left;font-weight:400;letter-spacing:.1em;font-size:10px;padding:6px 8px;border-bottom:1px solid var(--gold)}
  td{padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  tr:hover td{background:#241c14}
  .own{color:var(--dim)} .name{color:var(--gold-pale);font-weight:600} .lib td.own{color:var(--gold)}
  .sw{display:inline-block;width:13px;height:13px;border-radius:3px;vertical-align:-2px;margin-right:3px;border:1px solid #0008}
  .num{text-align:right} td.num{color:var(--blue)}
  .note{color:var(--dim);font-size:12px;margin-top:8px}
</style></head>
<body><div id="app">Loading the live tables…</div><script type="module" src="/src/beam-chart.js"></script></body></html>
